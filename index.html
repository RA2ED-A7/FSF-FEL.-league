<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freestyle Elite league | Season 2</title>
    <style>
        :root {
            --bg: #0b0f17;
            --surface: #141b2a;
            --surface-2: #1b2438;
            --accent: #ff3b5c;
            --accent-2: #38bdf8;
            --text: #e8eef7;
            --muted: #8a94a6;
            --border: #25304a;
            --good: #34d399;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: radial-gradient(1200px 600px at 80% -10%, #1b2a4a 0%, transparent 60%),
                        radial-gradient(1000px 600px at -10% 110%, #2a1635 0%, transparent 55%),
                        var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: var(--accent-2); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.9rem 2rem;
            background: rgba(11, 15, 23, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }
        .brand { font-weight: 800; font-size: 1.1rem; letter-spacing: 0.5px; white-space: nowrap; }
        .brand .season { color: var(--accent); }
        nav.menu { display: flex; gap: 1.75rem; font-size: 0.95rem; }
        nav.menu a { color: var(--text); opacity: 0.85; }
        nav.menu a:hover { opacity: 1; color: var(--accent); text-decoration: none; }
        .header-right { display: flex; align-items: center; gap: 1rem; }
        .user { display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; }
        .avatar {
            width: 30px; height: 30px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 700; color: #fff;
        }
        .signin {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.5rem 1.1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .signin:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(255, 59, 92, 0.4); }
        .changelog {
            display: flex; align-items: center; gap: 0.45rem;
            font-size: 0.8rem; color: var(--muted);
            border: 1px solid var(--border);
            padding: 0.4rem 0.8rem; border-radius: 999px;
            cursor: pointer;
        }
        .changelog .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }

        main { flex: 1; max-width: 960px; margin: 2rem auto; padding: 0 1.5rem; width: 100%; }

        /* Match card */
        .match-card {
            background: linear-gradient(135deg, var(--surface-2), var(--surface));
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .match-card .label { font-size: 0.8rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 1rem; }
        .match-row { display: flex; align-items: center; justify-content: center; gap: 1.5rem; font-size: 1.1rem; }
        .team { display: flex; align-items: center; gap: 0.6rem; font-weight: 700; }
        .crest {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: #fff;
        }
        .score { font-size: 2rem; font-weight: 800; color: #fff; padding: 0 1rem; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
            text-align: center;
            transition: transform 0.15s, border-color 0.15s;
        }
        .stat:hover { transform: translateY(-3px); border-color: var(--accent); }
        .stat .num { font-size: 2.2rem; font-weight: 800; background: linear-gradient(135deg, var(--accent-2), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stat .txt { margin-top: 0.3rem; color: var(--muted); font-size: 0.9rem; }

        /* Week box */
        .week {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }
        .week h3 { font-size: 1.3rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .week h3 .tag { font-size: 0.75rem; background: var(--accent-2); color: #06121a; padding: 0.2rem 0.6rem; border-radius: 999px; font-weight: 700; }
        .week-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .week-item {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
        }
        .week-item .k { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
        .week-item .v { font-size: 1.4rem; font-weight: 700; margin-top: 0.25rem; }

        footer { text-align: center; padding: 1.5rem; color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--border); }

        @media (max-width: 720px) {
            header { flex-wrap: wrap; padding: 0.9rem 1rem; }
            nav.menu { order: 3; width: 100%; justify-content: space-around; }
            .stats, .week-grid { grid-template-columns: 1fr; }
            .match-row { flex-direction: column; gap: 0.5rem; }
            .score { border: none; padding: 0.2rem 0; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">Freestyle Elite league <span class="season">| Season 2</span></div>
        <nav class="menu">
            <a href="#">Home</a>
            <a href="#">Teams</a>
            <a href="#">Players</a>
            <a href="#">Fixtures</a>
            <a href="#">Standings</a>
        </nav>
        <div class="header-right">
            <div class="user"><span class="avatar">U</span><span>Username</span></div>
            <button class="signin">Sign In</button>
            <div class="changelog"><span class="dot"></span>Update Log</div>
        </div>
    </header>

    <main>
        <div class="match-card">
            <div class="label">Next Match</div>
            <div class="match-row">
                <div class="team"><span class="crest">N</span>None</div>
                <div class="score">0 - 0</div>
                <div class="team">None<span class="crest">N</span></div>
            </div>
        </div>

        <div class="stats">
            <div class="stat"><div class="num">5</div><div class="txt">Teams</div></div>
            <div class="stat"><div class="num">60</div><div class="txt">Players</div></div>
            <div class="stat"><div class="num">8</div><div class="txt">Game Weeks</div></div>
        </div>

        <div class="week">
            <h3>Week <span class="tag">Current</span></h3>
            <div class="week-grid">
                <div class="week-item"><div class="k">Matches</div><div class="v">0</div></div>
                <div class="week-item"><div class="k">Goals</div><div class="v">0</div></div>
                <div class="week-item"><div class="k">Transfer</div><div class="v">0</div></div>
            </div>
        </div>
    </main>

    <footer>
        <p>Freestyle Elite league &mdash; Season 2 &middot; Dark Edition</p>
    </footer>
</body>
</html>
